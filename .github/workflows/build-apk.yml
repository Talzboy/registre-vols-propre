name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le JavaScript de l'application
        run: npm test

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: registre-vols-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
